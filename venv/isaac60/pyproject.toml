[project]
name = "aa-isaac60-env"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "active-adaptation",
    # Keep this pinned to the Isaac 6.0-compatible version.
    "warp-lang",
]

[tool.uv.sources]
active-adaptation = { path = "../..", editable = true }

[tool.uv]
package = false
override-dependencies = [
    # assetx depends on usd-core, whose pxr would shadow Kit's. Cooking converts
    # USD in an isolated env, so the host never needs it.
    "usd-core ; sys_platform == 'never'",
]
