# @package task
name: A2LocoManip

viewer:
  resolution: [1280, 720]
  lookat: [0., 0., 0.]
  eye: [4.0, 4.0, 4.0]

robot:
  name: unitree_a2_piper
# terrain: slopes_boxes
terrain: plane


# common
num_envs: 4096
max_episode_length: 1000

sim:
  step_dt: 0.02
  isaac_physics_dt: 0.005
  mujoco_physics_dt: 0.002

input:
  action:
    _target_: ConcatenatedAction
    actions:
      - _target_: JointPosition
        action_scaling:
          .*_hip_joint: 0.5
          .*_thigh_joint: 0.5
          .*_calf_joint: 0.5
        max_delay: 1
        alpha_range: [0.9, 1.0]
      - _target_: JointReferenceModel
        action_scaling:
          arm_joint[1-3]: 1.0
          arm_joint[4-6]: 0.5
        omega: 20.0
        max_delay: 1
      - _target_: CorrelatedJointPosition
        joint_names: "arm_joint[7,8]"
        # arm_joint7: [0, 0.035], arm_joint8: [-0.035, 0] -> open/close together
        matrix: [1.0, -1.0]
        action_scaling: 0.035

command:
  _target_: LocoManipNew
  eef_body_name: "grasp_point"
  # Shared with A2LocoManipSparse goal-reaching geometry
  world_goal_radius_range: [1.5, 3.0]
  workspace_range:
    - [0.25, 0.75]   # x
    - [-0.2, 0.2]    # y
    - [0.2, 0.8]     # z (align with sparse eef_z_range)
  mode_probs_0: [0.0, 0.0, 1.0]
  mode_probs_1: [0.3, 0.5, 0.2]
  mode_transition_steps: 9600

observation:
  command:
    command:  {key: teacher}
  command_teacher: # automatically discarded if unused
    command:  {key: teacher}
  command_student: # automatically discarded if unused
    command:  {key: student}
  policy:
    gravity_multistep: {steps: 4, noise_std: 0.05}
    joint_pos_multistep: {steps: 4, noise_std: 0.05}
    joint_vel_multistep: {steps: 4, noise_std: 0.2}
    prev_actions: {steps: 2}
  # priv:
    body_vel_b: {body_names: grasp_point}
    root_linvel_b:    {yaw_only: true}
    root_angvel_b:    {}
  # extero:
  #   height_scan: {
  #     x_range: [-1.2, 1.2],
  #     y_range: [-1.0, 1.0],
  #     resolution: [0.1, 0.1],
  #     flatten: false,
  #   }

reward:
  loco:
    linvel_exp:         {weight: 1.5, dim: 2}
    linvel_projection:  {weight: 0.5}
    angvel_z_exp:       {weight: 1.0}
    angvel_xy_l2:       {weight: 0.01}
    linvel_z_l2:        {weight: 2.0}
    base_height_exp:    {weight: 1.0, target_height: 0.4, sigma: 0.4}
  manip:
    eef_pos_orient_tracking: {weight: 1.5}
    eef_grasp:          {weight: 1.0}
    eef_angvel_penalty: {weight: 0.002}
  regularization:
    energy_l1:          {weight: 0.0005}
    joint_acc_l2:       {weight: 2.5e-7, joint_names: "(?!(arm_joint[7,8])).*" } # exclude gripper joints
    joint_torques_l2:   {weight: 1.0e-4, joint_names: "(?!(arm_joint[7,8])).*" } # exclude gripper joints
    survival:           {weight: 1.0}
    action_rate_l2:     {weight: 0.01}
    action_rate2_l2:    {weight: 0.002}
    feet_air_time:      {weight: 1.0, body_names: .*_foot, thres: 0.5}
    max_swing_height:   {weight: 4.0, body_names: .*_foot, target_height: 0.15}
    feet_sliding:       {weight: 0.2, body_names: .*_foot}
    undesired_contact:  {body_names: [.*_calf, .*thigh], weight: 0.25}
  debug:
    _enabled_: false
    linvel_projection:  {weight: 0.5}
    feet_contact_count: {weight: 1.0, body_names: .*_foot}
    eef_pos_error_l1:   {weight: 1.0}

termination:
  max_episode_length: {}
  crash: {
    body_names_expr: [base_link, .*hip, .*thigh],
    t_thres: 0.06,
    prob: 0.4,
  }
  fall_over: {xy_thres: 0.9}
  undesired_contact: {body_names: [.*_calf]}

randomization:
  perturb_body_mass:
    .*: [0.8, 1.2]
  randomize_materials_isaac:
    body_names: .*_foot
    static_friction_range:  [0.5, 3.0]
    dynamic_friction_range: [0.5, 3.0]
    restitution_range:      [0.0, 0.5]
    homogeneous: true
  actuator_pd_gains:
    stiffness_range:
      .*: [0.9, 1.1]
    damping_range:
      .*: [0.9, 1.1]
  reset_joint_states_scale:
    pos_scales:
      .*: [0.8, 1.2]
  push_body:
    body_names: "base_link"
    force_range: [20, 60]
    min_interval: 100
    decay: 0.9
